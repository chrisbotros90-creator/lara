name: Build lara IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install ldid
        run: brew install ldid

      - name: Fix dylib paths
        run: |
          mkdir -p lara/lib
          [ -f libxpf.dylib ] && mv libxpf.dylib lara/lib/
          [ -f libgrabkernel2.dylib ] && mv libgrabkernel2.dylib lara/lib/
          ls lara/lib/

      - name: Build IPA
        run: |
          SDK=$(xcodebuild -showsdks | grep "iphoneos" | grep -v simulator | tail -1 | grep -oE 'iphoneos[0-9.]+')
          echo "Using SDK: $SDK"
          rm -rf build/
          mkdir -p build
          xcodebuild \
            -project lara.xcodeproj \
            -scheme lara \
            -configuration Release \
            -sdk "$SDK" \
            ARCHS=arm64e \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="Config/lara.entitlements" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            ENABLE_BITCODE=NO \
            archive \
            -archivePath "$PWD/build/lara.xcarchive"
          APP_PATH="$PWD/build/lara.xcarchive/Products/Applications/lara.app"
          mkdir -p "$PWD/build/Payload"
          cp -R "$APP_PATH" "$PWD/build/Payload/"
          plutil -replace UIFileSharingEnabled -bool YES "$PWD/build/Payload/lara.app/Info.plist"
          ldid -SConfig/lara.entitlements "$PWD/build/Payload/lara.app/lara"
          cd "$PWD/build" && zip -qry lara.ipa Payload
          echo "Done!"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: lara-ipa
          path: build/lara.ipa
          retention-days: 30
