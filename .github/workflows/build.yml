name: Build lara IPA
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install ldid
        run: brew install ldid

      - name: Build
        run: |
          set -o pipefail
          mkdir -p build

          xcodebuild \
            -project lara.xcodeproj \
            -scheme lara \
            -configuration Release \
            -derivedDataPath "$PWD/build/DerivedDataApp" \
            -destination 'generic/platform=iOS' \
            ARCHS=arm64e \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            ENABLE_BITCODE=NO \
            clean build \
            2>&1 | tee build/xcodebuild.log

          APP_PATH="$PWD/build/DerivedDataApp/Build/Products/Release-iphoneos/lara.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Build did not produce lara.app — see log below."
            tail -n 80 build/xcodebuild.log
            exit 1
          fi

          # Strip Xcode's ad-hoc signature (mirrors ipabuild.sh)
          codesign --remove "$APP_PATH" || true
          rm -rf "$APP_PATH/_CodeSignature"
          rm -f  "$APP_PATH/embedded.mobileprovision"

          # Re-sign the binary with jailbreak entitlements via ldid
          if [ -f Config/lara.entitlements ]; then
            ldid -SConfig/lara.entitlements "$APP_PATH/lara"
          else
            ldid -S "$APP_PATH/lara"
          fi

          # Enable file sharing (needed for kernelcache sideloading)
          plutil -replace UIFileSharingEnabled -bool YES "$APP_PATH/Info.plist"

          # Package as IPA
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          ( cd build && zip -qry lara.ipa Payload )
          echo "Done! IPA at build/lara.ipa"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 7

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: lara-ipa
          path: build/lara.ipa
          retention-days: 30
