name: Build lara IPA
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install ldid
        run: brew install ldid

      - name: Fix structure
        run: |
          mkdir -p lara/lara/lib
          for d in assets classes funcs headers kexploit views PartyUI other; do
            [ -d "$d" ] && cp -R "$d" lara/lara/ && echo "copied $d"
          done
          for f in Info.plist lara.swift lara-Bridging-Header.h; do
            [ -f "$f" ] && cp "$f" lara/lara/ && echo "copied $f"
          done
          cp libgrabkernel2.dylib lara/lara/lib/ 2>/dev/null || true
          cp libxpf.dylib lara/lara/lib/ 2>/dev/null || true
          echo "lara/lara contents:"
          ls lara/lara/

      - name: Patch pbxproj
        run: |
          sed -i '' 's/GENERATE_INFOPLIST_FILE = YES/GENERATE_INFOPLIST_FILE = NO/g' lara.xcodeproj/project.pbxproj
          echo "Patched pbxproj"

      - name: List schemes (diagnostics)
        run: xcodebuild -list -project lara.xcodeproj

      - name: Build IPA
        run: |
          set -o pipefail
          rm -rf build
          mkdir -p build

          xcodebuild \
            -project lara.xcodeproj \
            -scheme lara \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            ARCHS=arm64e \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="Config/lara.entitlements" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            ENABLE_BITCODE=NO \
            archive \
            -archivePath "$PWD/build/lara.xcarchive" \
            2>&1 | tee build/xcodebuild.log

          APP_PATH="$PWD/build/lara.xcarchive/Products/Applications/lara.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Archive did not produce lara.app — see log below."
            tail -n 80 build/xcodebuild.log
            exit 1
          fi

          mkdir -p "$PWD/build/Payload"
          cp -R "$APP_PATH" "$PWD/build/Payload/"
          plutil -replace UIFileSharingEnabled -bool YES "$PWD/build/Payload/lara.app/Info.plist"
          ldid -SConfig/lara.entitlements "$PWD/build/Payload/lara.app/lara"
          ( cd "$PWD/build" && zip -qry lara.ipa Payload )
          echo "Done! IPA at build/lara.ipa"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 7

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: lara-ipa
          path: build/lara.ipa
          retention-days: 30
