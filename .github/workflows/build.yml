name: Build lara IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install ldid
        run: brew install ldid

      - name: Fix structure
        run: |
          mkdir -p lara/lara/lib
          for d in assets classes funcs headers kexploit views PartyUI other; do
            [ -d "$d" ] && cp -R "$d" lara/lara/ && echo "copied $d"
          done
          for f in Info.plist lara.swift lara-Bridging-Header.h; do
            [ -f "$f" ] && cp "$f" lara/lara/ && echo "copied $f"
          done
          cp libgrabkernel2.dylib lara/lara/lib/ 2>/dev/null || true
          cp libxpf.dylib lara/lara/lib/ 2>/dev/null || true
          echo "lara/lara contents:"
          ls lara/lara/

      - name: Build IPA
        run: |
          SDK=$(xcodebuild -showsdks | grep "iphoneos" | grep -v simulator | tail -1 | grep -oE 'iphoneos[0-9.]+')
          echo "Using SDK: $SDK"
          rm -rf build/
          mkdir -p build
          xcodebuild \
            -project lara.xcodeproj \
            -scheme lara \
            -configuration Release \
            -sdk "$SDK" \
            ARCHS=arm64e \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="Config/lara.entitlements" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            ENABLE_BITCODE=NO \
            GENERATE_INFOPLIST_FILE=NO \
            archive \
            -archivePath "$PWD/build/lara.xcarchive" 2>&1 | grep -E "error:|warning:|ARCHIVE|Build"
          APP_PATH="$PWD/build/lara.xcarchive/Products/Applications/lara.app"
          mkdir -p "$PWD/build/Payload"
          cp -R "$APP_PATH" "$PWD/build/Payload/"
          plutil -replace UIFileSharingEnabled -bool YES "$PWD/build/Payload/lara.app/Info.plist"
          ldid -SConfig/lara.entitlements "$PWD/build/Payload/lara.app/lara"
          cd "$PWD/build" && zip -qry lara.ipa Payload
          echo "Done!"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: lara-ipa
          path: build/lara.ipa
          retention-days: 30
