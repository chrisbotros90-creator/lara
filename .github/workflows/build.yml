name: Build lara IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install ldid
        run: brew install ldid

      - name: Extract and patch
        run: |
          pwd
          ls -la *.zip
          unzip -q lara-main_7.zip -d extracted
          cd extracted/lara-main
          cp ../../libgrabkernel2.dylib lara/lib/ 2>/dev/null || true
          cp ../../libxpf.dylib lara/lib/ 2>/dev/null || true
          
          # Fix ProcessInfo.processInfo -> ProcessInfo()
          find . -name "*.swift" -type f -exec sed -i '' 's/ProcessInfo\.processInfo/ProcessInfo()/g' {} \;
          
          # Apply all other fixes with Python
          python3 << 'PYSCRIPT'
          import os
          import re

          def prepend(path, line):
              with open(path) as f: c = f.read()
              if line not in c:
                  with open(path, 'w') as f: f.write(line + '\n' + c)

          # Add import statements
          prepend('lara/classes/laramgr.swift', 'import Foundation')
          prepend('lara/funcs/isunsupported.swift', 'import Foundation')
          prepend('lara/views/fm/FileSystemHelpers.swift', 'import Foundation')
          prepend('lara/views/tools/ClipboardManagerView.swift', 'import Combine')
          prepend('lara/views/tools/DeviceInfoView.swift', 'import Foundation')

          # Add @MainActor to verifyPlist
          gestalt_path = 'lara/views/tweaks/mobilegestalt/GestaltView.swift'
          if os.path.exists(gestalt_path):
              with open(gestalt_path) as f: content = f.read()
              content = re.sub(
                  r'(\n)(\s*)func verifyPlist\(',
                  r'\1\2@MainActor\n\2func verifyPlist(',
                  content
              )
              with open(gestalt_path, 'w') as f: f.write(content)
              print('Added @MainActor to verifyPlist')

          # Fix Shape protocol warnings
          shape_files = [
              'lara/PartyUI/UI/Buttons/FancyButtonStyle.swift',
              'lara/PartyUI/UI/Buttons/PrimaryButtonStyle.swift',
              'lara/PartyUI/UI/Buttons/TranslucentButtonStyle.swift',
              'lara/PartyUI/UI/Inputs/TextFieldBackground.swift'
          ]
          for file_path in shape_files:
              if os.path.exists(file_path):
                  with open(file_path) as f: content = f.read()
                  content = re.sub(r':\s*Shape\b', ': any Shape', content)
                  content = content.replace('var shape: Shape', 'var shape: any Shape')
                  with open(file_path, 'w') as f: f.write(content)
                  print(f'Fixed Shape in {file_path}')

          # Update project settings
          pbx = 'lara.xcodeproj/project.pbxproj'
          with open(pbx) as f: c = f.read()
          c = c.replace('GENERATE_INFOPLIST_FILE = YES', 'GENERATE_INFOPLIST_FILE = NO')
          with open(pbx, 'w') as f: f.write(c)
          print('All patches applied')
          PYSCRIPT

      - name: Build IPA
        run: |
          cd extracted/lara-main
          set -o pipefail
          rm -rf build && mkdir -p build
          xcodebuild \
            -project lara.xcodeproj \
            -scheme lara \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            ARCHS=arm64e \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="Config/lara.entitlements" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            ENABLE_BITCODE=NO \
            archive \
            -archivePath "$PWD/build/lara.xcarchive" \
            2>&1 | tee build/xcodebuild.log
          APP_PATH="$PWD/build/lara.xcarchive/Products/Applications/lara.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Archive failed"
            tail -n 80 build/xcodebuild.log
            exit 1
          fi
          mkdir -p "$PWD/build/Payload"
          cp -R "$APP_PATH" "$PWD/build/Payload/"
          plutil -replace UIFileSharingEnabled -bool YES "$PWD/build/Payload/lara.app/Info.plist"
          ldid -SConfig/lara.entitlements "$PWD/build/Payload/lara.app/lara"
          ( cd "$PWD/build" && zip -qry lara.ipa Payload )
          echo "IPA built successfully!"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: extracted/lara-main/build/xcodebuild.log
          retention-days: 7

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: lara-ipa
          path: extracted/lara-main/build/lara.ipa
          retention-days: 30
