name: Build lara IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install ldid
        run: brew install ldid

      - name: Build IPA
        run: |
          unzip -q lara-main_7.zip -d extracted
          cd extracted/lara-main
          cp ../../libgrabkernel2.dylib lara/lib/ 2>/dev/null || true
          cp ../../libxpf.dylib lara/lib/ 2>/dev/null || true

          # Fix missing import Foundation
          for f in lara/classes/laramgr.swift lara/funcs/isunsupported.swift lara/views/fm/FileSystemHelpers.swift; do
            grep -q "^import Foundation" "$f" || sed -i '' '1s/^/import Foundation\n/' "$f"
          done

          # Fix missing import Combine in ClipboardManagerView
          sed -i '' 's/^import SwiftUI$/import SwiftU
